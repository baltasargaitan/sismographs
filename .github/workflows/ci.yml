name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build backend
      run: dotnet build --configuration Release --no-restore
    
    - name: Run tests
      run: dotnet test --configuration Release --no-build --verbosity normal --logger "console;verbosity=minimal"
      env:
        # Use safe dummy values for tests - no SMTP needed for unit tests
        MAIL_USER: test-user
        MAIL_KEY: test-key
        SMTP_FROM: test@example.com
        SMTP_NAME: Test System
        FRONTEND_ORIGIN: http://localhost:5173

  build-frontend:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend-react
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: './frontend-react/package-lock.json'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Lint code
      run: npm run lint
    
    - name: Build frontend
      run: npm run build
